{% extends "base.html" %}
{% block page_title %}{{ "Edit Customer" if customer else "Add Customer" }}{% endblock %}
{% block content %}

{% set data = form_data or customer %}

<div class="card p-4" style="max-width: 700px;">
  <h5 class="mb-3">{{ "Edit Customer" if customer else "Add New Customer" }}</h5>
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="form-control" value="{{ data.full_name if data else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Company Name</label>
        <input type="text" name="company_name" class="form-control" value="{{ data.company_name if data else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ data.email if data else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ data.phone if data else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ data.address if data else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Customer Type</label>
        <select name="customer_type" class="form-select">
          <option value="Individual" {% if data and data.customer_type == "Individual" %}selected{% endif %}>Individual</option>
          <option value="Business" {% if data and data.customer_type == "Business" %}selected{% endif %}>Business</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="Active" {% if not data or data.status == "Active" %}selected{% endif %}>Active</option>
          <option value="Inactive" {% if data and data.status == "Inactive" %}selected{% endif %}>Inactive</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3">{{ data.notes if data else '' }}</textarea>
      </div>
    </div>

    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save Customer</button>
      <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
